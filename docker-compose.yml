version: '3.8'

services:
  fincontroller:
    build: .
    container_name: razorpay_ai_finance_controller
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - LLM_PROVIDER=fallback
    volumes:
      - ./data:/app/data
    restart: unless-stopped
