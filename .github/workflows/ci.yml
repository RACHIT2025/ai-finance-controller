name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov respx

    - name: Run Test Suite & Coverage
      run: |
        pytest tests/ -v

    - name: Run Ground-Truth Benchmark Evaluation
      run: |
        python -m fincontroller.cli.main benchmark --seed 42

    - name: Verify Tamper-Evident Cryptographic Audit Chain
      run: |
        python -m fincontroller.cli.main verify-audit
